<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-app</title>
    <link rel="stylesheet" href="Todo.css">
</head>
<body>
    <div>
        <img src="circle-check-regular-full.svg" alt="To-Do List Icon" width="50" height="50" style="margin-left: -220px; margin-bottom: -65px; color:green;">
        <h1>To-Do List</h1>
        <p>Stay organized and productive</p>
    </div>
    
    <div class="task-form">
        <form action="text" method="post">
            <input type="text" name="task" placeholder="Add a new task..." id="Itd" required>
            <button type="submit" id="Tid"> + Add Task</button>
        </form>
    </div>
    <br>

    <div class="task-list" style="display: flex; flex-direction: row;">
        <div class="div1">
            <button>
                <h2>0</h2>
                <p>Active</p>
            </button>
        </div>

        <div class="div2">
            <button>
                <h2>0</h2>
                <p>Completed</p>
            </button>
        </div>

        <div class="div3">
            <button>
                <h2>0</h2>
                <p>Total</p>
            </button>
        </div>
    </div>

    <div class="todo-container"></div>
   
    <script src="Todo.js"></script>
</body>
</html>
